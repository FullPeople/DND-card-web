# Included at http scope through the existing sites-enabled directory.
limit_req_zone $binary_remote_addr zone=dnd_cloud_api:10m rate=10r/s;
server {
    listen 443 ssl http2;
    server_name dnd.center;
    ssl_certificate /etc/letsencrypt/live/dnd.center/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dnd.center/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/dnd-center;
    index index.html;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 8m;
    location = /card { return 308 /card/; }
    location = /library { return 308 /library/; }
    location ^~ /api/ {
        limit_req zone=dnd_cloud_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /card/sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~* "^/(card|library)/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
server {
    listen 80;
    server_name dnd.center;
    return 301 https://dnd.center$request_uri;
}
