<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>
  window.addEventListener('error',function(event){
    var target=event.target;if(!target||!(target.tagName==='SCRIPT'||target.tagName==='LINK'&&target.rel==='stylesheet'))return;
    function recover(){
      if(document.body.dataset.intro==='complete')return;
      document.body.dataset.intro='failed';document.body.classList.remove('intro-active');
      var toast=document.getElementById('toast'),retry=document.getElementById('skip-intro');
      if(toast){toast.textContent='页面文件未能加载，请重新加载。';toast.setAttribute('role','alert');toast.classList.add('visible');}
      if(retry){retry.textContent='重新加载';retry.style.visibility='visible';retry.onclick=function(){location.reload();};}
    }
    if(document.body)recover();else document.addEventListener('DOMContentLoaded',recover,{once:true});
  },true);
  </script>
