name: Verify explicit infusion controls
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/infusion-*.test.ts'
      - 'tests/enhanced-weapon*.test.ts'
      - 'tests/returning-weapon*.test.ts'
      - 'tests/e2e/infusion*.ts'
      - 'tests/e2e/enhancedWeapon*.ts'
      - 'tests/e2e/returningWeapon*.ts'
      - 'tests/e2e/fixtures.ts'
      - 'docs/data/automation*'
      - 'playwright.infusions.config.ts'
      - 'vite*.config.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/infusion-controls.yml'
permissions:
  contents: read
concurrency:
  group: infusion-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFUSION_SOURCE_DIR: .local-evidence/infusion-upstream
      INFUSION_FROZEN_DIR: .local-evidence/infusion-upstream
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - name: Fetch three frozen inputs without publishing source text
        shell: bash
        run: |
          set -euo pipefail
          revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
          mkdir -p "$INFUSION_SOURCE_DIR"
          curl --disable --fail --silent --show-error --max-time 60 --max-filesize 2000000 --proto '=https' \
            "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/optionalfeatures.json" \
            --output "$INFUSION_SOURCE_DIR/optionalfeatures-$revision.json"
          curl --disable --fail --silent --show-error --max-time 60 --max-filesize 2000000 --proto '=https' \
            "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/class/class-artificer.json" \
            --output "$INFUSION_SOURCE_DIR/class-artificer-$revision.json"
          curl --disable --fail --silent --show-error --max-time 60 --max-filesize 2000000 --proto '=https' \
            "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/items-base.json" \
            --output "$INFUSION_FROZEN_DIR/items-base.json"
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const evidence=JSON.parse(readFileSync('src/core/automation/infusionEvidence.json','utf8'));
          const revision='e2623b204ddbdf2bcfa8317acfc962de89c676e2';
          if(evidence.frozenRevision!==revision)throw Error('Unexpected frozen infusion revision');
          const results=[];
          for(const [name,key] of [['optionalfeatures','optionalfeatures.json'],['class-artificer','class/class-artificer.json']]){
            const bytes=readFileSync(`${process.env.INFUSION_SOURCE_DIR}/${name}-${revision}.json`);
            const sha256=createHash('sha256').update(JSON.stringify(JSON.parse(bytes.toString('utf8')))).digest('hex');
            if(sha256!==evidence.inputs[key])throw Error(`Frozen input hash mismatch: ${name}`);
            results.push({name:key,bytes:bytes.length,sha256});
          }
          const base=JSON.parse(readFileSync(`${process.env.INFUSION_FROZEN_DIR}/items-base.json`,'utf8'));
          const baseSha=createHash('sha256').update(JSON.stringify(base)).digest('hex');
          if(baseSha!=='8933a3e70e47aa4fd6196bd7f1f2e3a57d6d8dbe7e781d37bb6a0519d7c4ffff')throw Error('Frozen base-item hash mismatch');
          writeFileSync(`${process.env.INFUSION_FROZEN_DIR}/index.json`,JSON.stringify({rows:[{url:'https://5e.kiwee.top/data/items-base.json',path:'items-base.json',sha256:baseSha}]}));
          results.push({name:'items-base.json',bytes:readFileSync(`${process.env.INFUSION_FROZEN_DIR}/items-base.json`).length,sha256:baseSha});
          writeFileSync('.local-evidence/infusion-source-verification.json',JSON.stringify({revision,verified:true,inputs:results},null,2)+'\n');
          console.log('Verified three frozen inputs; source text is not an artifact.');
          NODE
      - name: Source replay, persistence, restrictions and UI guards
        run: npx vitest run tests/infusion-activation.test.ts tests/infusion-controls.test.ts tests/enhanced-weapon.test.ts tests/enhanced-weapon-controls.test.ts tests/returning-weapon.test.ts tests/returning-weapon-controls.test.ts tests/automation209-weapons.test.ts
      - run: npx tsc -b
      - name: Formal standalone build with the required runtime coverage gate
        run: npx vite build --config vite.standalone-cloud.config.ts --mode standalone
      - run: npx playwright install --with-deps chromium
      - name: Real App target activation, reload, withdrawal, source restriction and read-only tabs
        run: npx playwright test --config playwright.infusions.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infusion-control-evidence
          include-hidden-files: true
          path: |
            .local-evidence/infusion-browser/
            .local-evidence/infusion-source-verification.json
          if-no-files-found: warn
          retention-days: 7
