name: Verify reviewed infusion and invocation controls
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/infusion-*.test.ts'
      - 'tests/radiant-*.test.ts'
      - 'tests/refueling-*.test.ts'
      - 'tests/fixtures/radiantRefueling*.ts'
      - 'tests/e2e/radiantRefueling*.ts'
      - 'tests/attuned-infusion*.test.ts'
      - 'tests/e2e/attunedInfusion*.ts'
      - 'tests/arcane-focus*.test.ts'
      - 'tests/invocation*.test.ts'
      - 'tests/reviewed-feats*.test.ts'
      - 'tests/reviewed-armor-*.test.ts'
      - 'tests/reviewed-modern-*.test.ts'
      - 'tests/reviewed-weapon-master*.test.ts'
      - 'tests/e2e/reviewedWeaponMaster*.ts'
      - 'tests/e2e/weaponMasterControls.spec.ts'
      - 'tests/training-chips-editing.test.ts'
      - 'tests/e2e/reviewedArmorFeat*.ts'
      - 'tests/e2e/armorFeatControls.spec.ts'
      - 'tests/e2e/reviewedRuleBrowserState.ts'
      - 'tests/helpers/frozenReviewedFeatLegacy.ts'
      - 'tests/helpers/frozenReviewedWeaponLegacy.ts'
      - 'tests/e2e/reviewedPassiveFeat*.ts'
      - 'tests/enhanced-weapon*.test.ts'
      - 'tests/returning-weapon*.test.ts'
      - 'tests/e2e/infusion*.ts'
      - 'tests/e2e/arcaneFocus*.ts'
      - 'tests/e2e/invocation*.ts'
      - 'tests/e2e/enhancedWeapon*.ts'
      - 'tests/e2e/returningWeapon*.ts'
      - 'tests/e2e/fixtures.ts'
      - 'tests/e2e/authoredChoicesFixture.ts'
      - 'docs/data/automation*'
      - 'playwright.infusions.config.ts'
      - 'vite*.config.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/infusion-controls.yml'
permissions:
  contents: read
concurrency:
  group: infusion-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, narrow]
    env:
      INFUSION_SOURCE_DIR: .local-evidence/infusion-upstream
      INFUSION_FROZEN_DIR: .local-evidence/infusion-upstream
      INVOCATION_FROZEN_DIR: .local-evidence/infusion-upstream
      INFUSION_LEGACY_REQUIRED: '1'
      REFUELING_LEGACY_REQUIRED: '1'
      REFUELING_FROZEN_DIR: .local-evidence/infusion-upstream
      REFUELING_FROZEN_REQUIRED: '1'
      REVIEWED_FEATS_FROZEN_DIR: .local-evidence/passive-feat-upstream
      PASSIVE_FEAT_TEST_INPUTS: .local-evidence/passive-feat-upstream
      REVIEWED_FEAT_LEGACY_REQUIRED: '1'
      REVIEWED_WEAPON_LEGACY_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - name: Fetch six frozen inputs without publishing source text
        shell: bash
        run: |
          set -euo pipefail
          revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
          mkdir -p "$INFUSION_SOURCE_DIR"
          for path in optionalfeatures.json class/class-artificer.json items-base.json items.json class/class-warlock.json spells/spells-phb.json; do
            input_revision="$revision"; if [ "$path" = items.json ]; then input_revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            filename="$(basename "$path" .json)-$revision.json"
            limit=2000000; if [ "$path" = items.json ]; then limit=8000000; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize "$limit" --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$input_revision/data/$path" \
              --output "$INFUSION_SOURCE_DIR/$filename"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const infusion=JSON.parse(readFileSync('src/core/automation/infusionEvidence.json','utf8'));
          const invocation=JSON.parse(readFileSync('src/core/automation/invocationEvidence.json','utf8'));
          const revision='e2623b204ddbdf2bcfa8317acfc962de89c676e2';
          if(infusion.frozenRevision!==revision||invocation.frozenRevision!==revision)throw Error('Unexpected frozen source revision');
          const expected=new Map();
          for(const [path,hash] of [...Object.entries(infusion.inputs),...Object.entries(invocation.inputs),['items-base.json','8933a3e70e47aa4fd6196bd7f1f2e3a57d6d8dbe7e781d37bb6a0519d7c4ffff']]){
            if(expected.has(path)&&expected.get(path)!==hash)throw Error('Conflicting evidence hash: '+path);
            expected.set(path,hash);
          }
          const results=[],rows=[];
          for(const [path,hash] of expected){
            const filename=path.split('/').at(-1).replace('.json',`-${revision}.json`);
            const bytes=readFileSync(`${process.env.INFUSION_SOURCE_DIR}/${filename}`);
            const sha256=createHash('sha256').update(JSON.stringify(JSON.parse(bytes.toString('utf8')))).digest('hex');
            if(sha256!==hash)throw Error('Frozen input hash mismatch: '+path);
            results.push({name:path,revision:path==='items.json'?'5cc0bbe2c2b241a334e731af4448bdba2168e8bd':revision,bytes:bytes.length,sha256});
            rows.push({url:`https://5e.kiwee.top/data/${path}`,path:filename,sha256});
          }
          if(rows.length!==6)throw Error('Expected exactly six frozen source inputs');
          writeFileSync(`${process.env.INFUSION_FROZEN_DIR}/index.json`,JSON.stringify({rows}));
          writeFileSync('.local-evidence/infusion-source-verification.json',JSON.stringify({revision,verified:true,inputs:results},null,2)+'\n');
          console.log('Verified six frozen inputs; source text is not an artifact.');
          NODE
      - name: Verify nine reviewed passive, armor and weapon feat inputs without publishing source text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVIEWED_FEATS_FROZEN_DIR"
          for path in feats.json class/class-fighter.json class/class-artificer.json class/class-wizard.json class/class-bard.json class/class-cleric.json items-base.json variantrules.json magicvariants.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [ "$path" = feats.json ] || [ "$path" = magicvariants.json ]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output "$REVIEWED_FEATS_FROZEN_DIR/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const expected={
            'feats.json':'0491b421f5f1db6628c3a8aeb86bbc3b72b56bf101a14ba96acbe19c829a56a6',
            'class/class-fighter.json':'a4c5afc0e7ec7a444d1418a04ab4fe392b9a7a25907ac0fb9b8618a79d1ee509',
            'class/class-artificer.json':'c65cad57eebdfff6508a0cfb821ec670a41cc3f057512cadd19f3805cf1a01d7',
            'class/class-wizard.json':'7533f3fb7bab70cd2d2f2b5dfb7e259dc66a2bfee24ee6ad3809042e53ba8a03',
            'class/class-bard.json':'ac95dc8f1d795c0764ae6314e846d8efdcbbb4b42a8c721551265467885ed31c',
            'class/class-cleric.json':'011edfef6c76cd0f70143d83db3b5e8b9b0d31ca1557b4c0954bedc619615344',
            'items-base.json':'8933a3e70e47aa4fd6196bd7f1f2e3a57d6d8dbe7e781d37bb6a0519d7c4ffff',
            'variantrules.json':'21eef107d25cf438eb85894387fb6f834478d80bc467791c54fe66db9e498c44',
            'magicvariants.json':'4a4b0f3c8b268d8b134386f16e705df9b14d60419b2f2fa160da45b78bd4967d',
          };
          const rows=[];
          for(const [path,hash] of Object.entries(expected)){
            const filename=path.split('/').at(-1),bytes=readFileSync(`${process.env.REVIEWED_FEATS_FROZEN_DIR}/${filename}`);
            const sha256=createHash('sha256').update(JSON.stringify(JSON.parse(bytes.toString('utf8')))).digest('hex');
            if(sha256!==hash)throw Error('Frozen passive-feat input mismatch: '+path);
            const revision=['feats.json','magicvariants.json'].includes(path)?'5cc0bbe2c2b241a334e731af4448bdba2168e8bd':'e2623b204ddbdf2bcfa8317acfc962de89c676e2';
            rows.push({url:`https://5e.kiwee.top/data/${path}`,path:filename,sha256,revision,retrievalUrl:`https://raw.githubusercontent.com/tjliqy/5etools-cn/${revision}/data/${path}`});
          }
          if(rows.length!==9)throw Error('Expected exactly nine reviewed feat source inputs');
          writeFileSync(`${process.env.REVIEWED_FEATS_FROZEN_DIR}/index.json`,JSON.stringify({rows}));
          writeFileSync('.local-evidence/passive-feat-source-verification.json',JSON.stringify({verified:true,rows},null,2)+'\n');
          console.log('Verified nine reviewed passive, armor and weapon feat inputs; source text is not an artifact.');
          NODE
      - name: Fetch exact old consumer for charge-preservation verification
        run: git fetch --no-tags --depth=1 origin 70a9d58cdc4d7148a458704f4425de4b4cb91129
      - name: Fetch ninth-stage consumer for localized-v2 and ring preservation
        run: git fetch --no-tags --depth=1 origin 2f8bb8938c55a0f1a937efe95bdbf30222680f86
      - name: Fetch accepted pre-feat consumer for retained-intent compatibility
        run: git fetch --no-tags --depth=1 origin a5cdee8682a4b96fe77f946a55e95d76250c7118
      - name: Fetch exact accepted pre-Weapon Master consumer
        run: git fetch --no-tags --depth=1 origin d3540abcf9f9600cdb683433e7b05a767a1dd0a8
      - name: Source replay, persistence, restrictions and UI guards
        run: npx vitest run tests/radiant-*.test.ts tests/refueling-*.test.ts tests/infusion-charge*.test.ts tests/attuned-infusion*.test.ts tests/arcane-focus.test.ts tests/arcane-focus-controls.test.ts tests/returning-weapon.test.ts tests/returning-weapon-controls.test.ts tests/enhanced-weapon.test.ts tests/enhanced-weapon-controls.test.ts tests/infusion-activation.test.ts tests/infusion-controls.test.ts tests/infusion-source-identity.test.ts tests/automation209-weapons.test.ts tests/characterDetails.test.ts tests/automation209-spells.test.ts tests/numberInput234.test.ts tests/invocations.test.ts tests/invocation-spell-expansion.test.ts tests/invocation-level9.test.ts tests/invocation-atwill-final.test.ts tests/invocation-skill-guard.test.ts tests/invocation-dual-payment.test.ts tests/invocation-dual-controls.test.ts tests/invocation-regression.test.ts tests/invocation-ui.test.ts tests/sourceSpellChoiceLifecycle.test.ts tests/sourceSpellMechanics217.test.ts tests/class-choice-support.test.ts tests/featureArmor.test.ts tests/sourceChoices232.test.ts tests/optional-feature-drag.test.ts tests/import-choice-ignore.test.ts tests/automation-choices-resources.test.ts --maxWorkers=2
      - name: Reviewed passive-feat source, lifecycle and player controls
        run: npx vitest run tests/reviewed-feats*.test.ts tests/reviewed-armor-*.test.ts tests/reviewed-modern-*.test.ts tests/reviewed-weapon-master*.test.ts tests/training-chips-editing.test.ts --maxWorkers=1
      - run: npx tsc -b
      - name: Formal standalone build with the required runtime coverage gate
        run: npx vite build --config vite.standalone-cloud.config.ts --mode standalone
      - run: npx playwright install --with-deps chromium
      - name: Real App target activation, reload, withdrawal, source restriction and read-only tabs
        run: npx playwright test --config playwright.infusions.config.ts --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infusion-control-evidence-${{ matrix.project }}
          include-hidden-files: true
          path: |
            .local-evidence/infusion-browser/
            !.local-evidence/infusion-browser/.playwright-artifacts*/**
            .local-evidence/infusion-source-verification.json
            .local-evidence/passive-feat-source-verification.json
          if-no-files-found: warn
          retention-days: 7
