name: Standalone private cloud production
on:
  push:
    branches: [main, codex/standalone-cloud-production-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - name: Account privacy, storage recovery, bounded saves and card switching
        run: npx vitest run tests/standalone-cloud-production.test.ts tests/cloud-save-scheduler.test.ts tests/cloud-save-workload.test.ts tests/cloud-sync.test.ts tests/cloud-session.test.ts tests/cloudSuspension.test.ts tests/cloud-directory.test.ts tests/qq-permissions.test.ts tests/qq-login.test.ts tests/persistedCharacter.test.ts tests/cloud.test.ts tests/cloudChanges.test.ts tests/cloudSuspensionUi.test.ts tests/cloud-stage2.test.ts tests/cloud-card-switch.test.ts tests/snapshotSaveQueueP0.test.ts tests/cloud-card-switch-workload.test.ts tests/cloud-warm-reconciliation.test.ts tests/workspace-storage-recovery.test.ts
      - name: Fresh backups, in-place database preservation and rollback
        run: |
          python3 deploy/cloud/test_publish_standalone.py
          python3 deploy/cloud/test_update_stage_two.py
      - name: Explicit standalone production targets
        run: |
          npx vite build --config vite.standalone-cloud.config.ts --mode standalone
          npx vite build --config vite.library-cloud.config.ts --mode standalone
          node tools/checkStandaloneCloudBuild.mjs
          npx vite build --config vite.cloud.config.ts
      - name: Original default and embedded profiles stay suspended
        run: npx vite build --mode standalone
  class-choice-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npx vite build --mode standalone
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.class-choices.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: standalone-class-choice-evidence
          include-hidden-files: true
          path: .local-evidence/class-level-choices/
          retention-days: 3
  retained-card-browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Retained DOM, isolated contexts, input ownership, save recovery and catalog worker
        run: npm run test:retained-card-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: retained-card-browser-evidence
          include-hidden-files: true
          path: .local-evidence/retained-card-browser/
          retention-days: 3
