name: DND Center cloud migration
on:
  push:
    branches: [codex/qq-account-permissions-20261010, codex/qq-login-release-20261009, codex/unified-ui-20261008, codex/gallery-performance-256-20261008, codex/dnd-center-migration-20261007, codex/dnd-center-temporary-library-20261007, codex/dnd-center-latest-ui-20261008, codex/cloud-save-status-20261008]
  pull_request:
    # Shared modules the cloud flows exercise (staging, persistence, public viewing,
    # packaging) must also re-run these checks, not only the cloud-specific paths.
    paths: ['.github/workflows/cloud-migration.yml', 'deploy/qq/**', 'tests/qq-permissions.test.ts', 'tests/qq-login.test.ts', 'tests/e2e/qq-permissions.spec.ts', 'src/platform/workbench.ts', 'src/assets/class-badges/**', 'src/ui/classBadges.ts', 'src/ui/PaletteDrawer.tsx', 'src/ui/PaletteColorField.tsx', 'src/ui/paletteDrawer.css', 'src/ui/paletteHighlight.ts', 'src/platform/paletteSettings.ts', 'tests/e2e/palette258.spec.ts', 'tests/e2e/gallery258.spec.ts', 'tests/paletteSettings.test.ts', 'src/ui/appearance.css', 'src/platform/appearance.ts', 'tests/e2e/palette257.spec.ts', 'server/cloud/**', 'src/cloud/**', 'deploy/cloud/**', 'tests/cloud.test.ts', 'tests/e2e/cloud252.spec.ts', 'tests/e2e/gallery256.spec.ts', 'src/platform/afterPaint.ts', 'tools/startupChunks.ts', '*cloud*', 'library/**', 'public/cloud-home.html', 'src/platform/storage.ts', 'src/platform/requestTimeout.ts', 'src/platform/buildMode.ts', 'src/platform/announcement.ts', 'src/platform/releaseNotes.ts', 'src/ui/App.tsx', 'src/ui/PlayerViewer.tsx', 'src/ui/Announcement.tsx', 'src/core/validation.ts', 'tools/buildCloud.mjs', 'tools/standalonePlugin.ts', 'tools/offlineShell.ts', 'vite.library.config.ts', 'vite.config.ts', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run build:cloud
      - run: python3 deploy/cloud/test_publish.py
      - run: python3 deploy/cloud/test_upgrade.py
      - run: python3 deploy/qq/test_backend.py
      - run: python3 deploy/qq/publish_home.py --self-test
      - run: python3 deploy/cloud/test_frontend.py
      - run: python3 deploy/cloud/test_suite_links.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-migration-evidence
          path: |
            test-results-cloud
            dist-cloud
            dist-cloud-server
