name: DND Center cloud migration
on:
  push:
    branches: [codex/dnd-center-migration-20261007, codex/dnd-center-temporary-library-20261007]
  pull_request:
    paths: ['server/cloud/**', 'src/cloud/**', 'deploy/cloud/**', 'tests/cloud.test.ts', 'tests/e2e/cloud252.spec.ts', '*cloud*', 'library/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npm run test:cloud
      - run: npm run build:cloud
      - run: python3 deploy/cloud/test_publish.py
      - run: python3 deploy/cloud/test_upgrade.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-migration-evidence
          path: |
            test-results-cloud
            dist-cloud
            dist-cloud-server
