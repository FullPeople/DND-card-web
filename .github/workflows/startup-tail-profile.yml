name: Profile post-logo tail 241
# Read-only public pages only: /card/ and /suite-dev/workbench/ without any
# room/session fragment. Every sample uses a fresh Playwright context, no saved
# cookies, login, user browser profile, private character or room access.
# Product baseline: 9e8cf1fdafcb29d5573a8467418ea32b9ad41f70 (241).
# Historical comparison: 4e398a39a5cb37e5e632ae377fdf2488cdc3924c (230).
on:
  push:
    branches: [fix/owner-startup-243-20261003, fix/owner-startup-242-20261003, fix/startup-tail-241-20261003, fix/owner-startup-241-20261003]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify candidate descends from the observed 241 source
        run: git merge-base --is-ancestor 9e8cf1fdafcb29d5573a8467418ea32b9ad41f70 HEAD
      - run: npm run build
      - run: npm run build:standalone
      - run: node tools/checkStartupBoundary241.mjs
      - name: Build released 230 with identical dependency versions
        run: |
          git worktree add --detach /tmp/startup-230 4e398a39a5cb37e5e632ae377fdf2488cdc3924c
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/startup-230/node_modules
          cd /tmp/startup-230
          npm run build:standalone
      - name: Build fixed observed 241 baseline
        run: |
          git worktree add --detach /tmp/startup-241 9e8cf1fdafcb29d5573a8467418ea32b9ad41f70
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/startup-241/node_modules
          cd /tmp/startup-241
          npm run build
          npm run build:standalone
      - run: npx playwright install --with-deps chromium
      - run: node tools/profileStartupTail241.mjs
        env:
          STARTUP_BASELINE_DIR: /tmp/startup-230
          STARTUP_241_DIR: /tmp/startup-241
          STARTUP_PROFILE_LOCAL_ONLY: '1'
      - run: npx playwright test --config playwright.startup-tail.config.ts
        env:
          STARTUP_BASELINE_CHECK: '1'
          STARTUP_BASELINE_DIR: /tmp/startup-241
      - run: npx playwright test --config playwright.startup-tail.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-tail241-profile
          include-hidden-files: true
          path: .local-evidence/startup-tail241/
          retention-days: 7

  public-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only public HTTP and isolated cold/warm browser samples
        run: node tools/diagnoseStartupPublic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-public-diagnostic
          include-hidden-files: true
          retention-days: 7
          path: .local-evidence/startup-public/
