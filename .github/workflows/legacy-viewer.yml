name: Verify legacy viewer JSON and captions
on:
  pull_request:
    paths: ['src/ui/PlayerViewer.tsx','src/ui/TrainingChips.tsx','src/ui/trainingReferences.ts','src/ui/uiText.ts','tests/training-caption.test.ts','tests/e2e/legacyViewerJson.spec.ts','playwright.legacy-viewer.config.ts','.github/workflows/legacy-viewer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -- --run tests/training-caption.test.ts tests/shield-training-reference.test.ts
      - run: npm run build:standalone
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.legacy-viewer.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-viewer-${{ github.sha }}
          retention-days: 7
          include-hidden-files: true
          path: .local-evidence/legacy-viewer/
