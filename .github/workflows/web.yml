name: Verify web
on:
  push:
    branches: [codex/resource-repair246-20261005, codex/card-resource-repair-20261004, codex/card-suite-combined-20261004, codex/fix-human-origin-feat-20261004,codex/card-ui-three-fixes-20261004,codex/restore-transition-rest-20261004, fix/workbench-recovery-online-safe-20261004, fix/owner-startup-243-20261003, codex/owner-sync243-20261004, codex/owner-sync242-20261004, fix/obr-owner-sync-20261003, codex/intro-three-dragon-20261003, main, codex/direct232-followup-20261002, codex/seven-card-fixes-20261003, codex/monster-card-lifecycle-20261003, codex/merge-monster237-20261003]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:standalone
      - run: node tools/checkStartupBoundary241.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-builds
          path: |
            dist/
            dist-standalone/
          if-no-files-found: error
          retention-days: 1
  browsers:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: transition-rest
            commands: |
              npx playwright test tests/e2e/transitionRest.spec.ts --project=chromium
          - group: workbench-recovery
            commands: |
              npx playwright test --config playwright.manager-recovery.config.ts
              npx playwright test --config playwright.window-shell.config.ts
          - group: origin-feat
            commands: |
              npx playwright test --config playwright.origin-feat.config.ts
          - group: owner-sync
            commands: |
              npx playwright test --config playwright.owner-sync.config.ts
          - group: screen-release
            commands: |
              npx playwright test --config playwright.screen.config.ts
              npm run test:release
          - group: feedback-touch
            commands: |
              npx playwright test --config playwright.feedback198.config.ts
              npx playwright test --config playwright.compat207.config.ts
              npx playwright test --config playwright.touch.config.ts
          - group: dashboard-appearance
            commands: |
              npx playwright test --config playwright.dashboard237.config.ts
          - group: armor-feature-followup
            commands: |
              npx playwright test --config playwright.armor-offsets.config.ts
              npx playwright test --config playwright.feature-armor.config.ts
          - group: startup-order
            commands: |
              npx playwright test --config playwright.startup-order.config.ts
              npx playwright test --config playwright.startup-tail.config.ts
              npx playwright test tests/e2e/threeDragonFullscreen.spec.ts --project=chromium
          - group: startup-integration
            commands: |
              npx playwright test --config playwright.wiki-recovery.config.ts
              npx playwright test --config playwright.integration230.config.ts
          - group: resources-sources
            commands: |
              npx playwright test --config playwright.feedback217.config.ts
              npx playwright test --config playwright.source-feedback.config.ts
          - group: monster-lifecycle
            commands: |
              npx playwright test --config playwright.monster-lifecycle.config.ts
          - group: card-fixes-235
            commands: |
              npx playwright test --config playwright.card-fixes235.config.ts
          - group: portrait-frame
            commands: |
              npx playwright test --config playwright.portrait-frame.config.ts
          - group: choices-standalone
            commands: |
              npx playwright test --config playwright.choices.config.ts
              npm run test:standalone
          - group: automation-unified
            commands: |
              DND_AUTOMATION_TEST_MODE=standalone npx playwright test --config playwright.automation209.config.ts
              npx playwright test --config playwright.unified191.config.ts
          - group: direct-232
            commands: |
              npx playwright test --config playwright.direct232.config.ts
              npx playwright test --config playwright.wiki232.config.ts
          - group: saving-throw-adjustments
            commands: |
              npx playwright test --config playwright.save-bonuses.config.ts
              npx playwright test tests/e2e/valueTraceImmediate.spec.ts --project=chromium
          - group: edit-profile-232
            commands: |
              node tools/profileCharacterEdits232.mjs
          - group: class-drop-profile-232
            commands: |
              node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --target ES2022 --lib ES2022,DOM,DOM.Iterable --module ESNext --moduleResolution Bundler --jsx react-jsx --strict --skipLibCheck --esModuleInterop --resolveJsonModule --types vite/client,node tools/profileClassDrops232.spec.ts
              node tools/profileClassDrops232.mjs
          - group: followup-230
            commands: |
              npx playwright test --config playwright.followup231.config.ts
              npx playwright test --config playwright.followup-ui231.config.ts
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check out exact recovery Suite panels
        if: matrix.group == 'workbench-recovery'
        uses: actions/checkout@v6
        with:
          repository: FullPeople/obr-suite
          ref: 66fba1ddf0ab95c840425176c36af0c4cfe373b7
          path: .paired-suite
          persist-credentials: false
      - name: Build permission and settings panels for detached-window regression
        if: matrix.group == 'workbench-recovery'
        working-directory: .paired-suite
        run: |
          npm ci
          WORKBENCH_PANEL_ONLY=permissions node tools/build-workbench-panels.mjs
          test -s dist-workbench-dev/workbench-panels/permissions.html
          WORKBENCH_PANEL_ONLY=settings node tools/build-workbench-panels.mjs
          test -s dist-workbench-dev/workbench-panels/settings.html
      - uses: actions/download-artifact@v4
        with:
          name: verified-web-builds
      - run: npx playwright install --with-deps chromium
      - name: Bind the installed Chromium and exact paired Suite
        if: matrix.group == 'workbench-recovery'
        run: |
          node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('CHROMIUM_PATH='+chromium.executablePath()); console.log('PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
          echo "SUITE_ROOT=$GITHUB_WORKSPACE/.paired-suite" >> "$GITHUB_ENV"
          echo "TDA_SUITE_SETTINGS_DIST=$GITHUB_WORKSPACE/.paired-suite/dist-workbench-dev/workbench-panels" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps firefox
        if: matrix.group == 'followup-230'
      - name: Run all checks in group
        shell: bash
        run: |
          result=0
          while IFS= read -r command; do
            [[ -z "$command" ]] && continue
            echo "::group::$command"
            if bash -eo pipefail -c "$command"; then
              echo "Check passed"
            else
              result=1
              echo "::error::Check failed: $command"
            fi
            echo "::endgroup::"
          done <<'CHECK_COMMANDS'
          ${{ matrix.commands }}
          CHECK_COMMANDS
          exit "$result"
        env:
          DND_217_RESULTS: test-results/feedback217
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.group }}
          include-hidden-files: true
          path: |
            test-results/
            test-results-*/
            .local-evidence/owner-sync/browser/
            .local-evidence/window-shell/results/
            .local-evidence/manager-recovery/
            .local-evidence/dashboard237/
            .local-evidence/armor-offsets/
            .local-evidence/feature-armor/
            .local-evidence/startup-order/
            .local-evidence/integration230-browser/
            .local-evidence/followup231-browser/
            .local-evidence/followup231-ui/
            .local-evidence/card-fixes235/
            .local-evidence/direct232-browser/
            .local-evidence/save-bonuses-browser/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.group == 'transition-rest' || matrix.group == 'workbench-recovery' || matrix.group == 'owner-sync' || matrix.group == 'direct-232' || matrix.group == 'saving-throw-adjustments' || matrix.group == 'edit-profile-232' || matrix.group == 'class-drop-profile-232' || matrix.group == 'resources-sources' || matrix.group == 'screen-release' || matrix.group == 'portrait-frame' || matrix.group == 'card-fixes-235' || matrix.group == 'startup-integration' || matrix.group == 'startup-order' || matrix.group == 'armor-feature-followup' || matrix.group == 'dashboard-appearance' || matrix.group == 'monster-lifecycle')
        with:
          name: direct232-evidence-${{ matrix.group }}
          include-hidden-files: true
          path: |
            test-results/
            .local-evidence/card-fixes235/
            .local-evidence/direct232-browser/
            .local-evidence/save-bonuses-browser/
            .local-evidence/owner-sync/browser/
            .local-evidence/window-shell/results/
            .local-evidence/manager-recovery/
            .local-evidence/dashboard237/
            .local-evidence/armor-offsets/
            .local-evidence/feature-armor/
            .local-evidence/startup-order/
            .local-evidence/integration230-browser/
            .local-evidence/wiki232/
            .local-evidence/edit-perf232/
            .local-evidence/class-drop-perf232/
            test-results/feedback217/
            test-results-screen/
            test-results/portrait-frame/
            test-results/monster-lifecycle/
          if-no-files-found: warn
          retention-days: 7
