<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#50525B"/><meta name="description" content="左侧角色卡，右侧规则资料。在卡片的提示下，查阅、选择并完成你的冒险者。"/><title>Full Suite · 角色卡与 Wiki</title><link rel="icon" href="./favicon.svg" data-app-icon="./exe_icon.png"/>
<style>.startup-panel{box-sizing:border-box;max-width:620px;margin:32px auto;padding:20px;background:#eee;color:#333;border:4px solid #50525b;font:16px/1.6 system-ui,sans-serif;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}.startup-panel h1{margin:0 0 12px;font-size:20px}.startup-panel button{font:inherit;padding:5px 14px;cursor:pointer}.startup-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.startup-panel[hidden]{display:none}.startup-intro{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#FFFF56;opacity:1;transition:opacity .45s ease;overflow:hidden}.startup-intro.leaving{opacity:0;pointer-events:none}.startup-intro[hidden]{display:none}html[data-card-startup]:not([data-card-startup="complete"]):not([data-card-startup="failed"]) #root{visibility:hidden}.startup-logo{position:relative;width:min(60vw,290px);aspect-ratio:1}.startup-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;opacity:0;animation:component-enter-fade 1.9s cubic-bezier(.22,.7,.2,1) both;animation-delay:var(--delay);animation-play-state:paused}.startup-intro.playing .startup-piece{animation-play-state:running}.startup-p1{--x:0%;--y:32%;--r:-14deg;--mx:0%;--my:4%;--mr:-2deg;--delay:0s;transform-origin:49.2% 65.7%}.startup-p2{--x:-36%;--y:-4%;--r:-24deg;--mx:-4%;--my:-1%;--mr:-3deg;--delay:.14s;transform-origin:31% 36.5%}.startup-p3{--x:16%;--y:-36%;--r:28deg;--mx:1.6%;--my:-4%;--mr:4deg;--delay:.28s;transform-origin:52% 28.1%}.startup-p4{--x:36%;--y:-14%;--r:75deg;--mx:4%;--my:-1.6%;--mr:8deg;--delay:.42s;transform-origin:78.7% 20.6%}@keyframes component-enter-fade{0%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}55%{opacity:.8;transform:translate(var(--mx),var(--my)) rotate(var(--mr))}100%{opacity:1;transform:translate(0,0) rotate(0)}}@media(prefers-reduced-motion:reduce){.startup-piece{animation-duration:1ms;animation-delay:0s}.startup-intro{transition-duration:1ms}}</style>
</head><body>
<noscript><style>#startup-intro{display:none}</style><p>浏览器未启用 JavaScript。请允许此网站运行 JavaScript 后重新打开。</p></noscript>
<div id="startup-intro" class="startup-intro" aria-label="启动动画"><div class="startup-logo" role="img" aria-label="Full Suite"><img class="startup-piece startup-p1" src="./startup-logo/4.PNG" alt=""/><img class="startup-piece startup-p2" src="./startup-logo/1.PNG" alt=""/><img class="startup-piece startup-p3" src="./startup-logo/2.PNG" alt=""/><img class="startup-piece startup-p4" src="./startup-logo/3.PNG" alt=""/></div></div>
<section id="startup" class="startup-panel" role="status" hidden><h1 id="startup-title">正在启动角色卡…</h1><p id="startup-message">正在加载程序，请稍候。</p><div id="startup-help" hidden><button id="startup-retry" type="button">重新加载</button><details><summary>错误详情（可复制给开发者）</summary><pre id="startup-detail"></pre></details></div><noscript>浏览器未启用 JavaScript。请允许此网站运行 JavaScript 后重新打开。</noscript></section>
<script>
(function(){
 var ready=false,failed=false,disposed=false,timer,animationDone=false,fading=false,started=Date.now(),stage='正在下载程序文件';
 var panel=document.getElementById('startup'),title=document.getElementById('startup-title'),message=document.getElementById('startup-message'),detail=document.getElementById('startup-detail');
 var intro=document.getElementById('startup-intro'),pieces=Array.from(intro.querySelectorAll('img'));
 function phase(value){document.documentElement.dataset.cardStartup=value;window.dispatchEvent(new CustomEvent('dnd-card-startup',{detail:value}));}
 phase('loading');
 // The persistent snapshot lets late React mounts/host handshakes observe the
 // same lifecycle. A modal must not enter the top layer until complete.
 function finish(){if(disposed||failed||document.documentElement.dataset.cardStartup==='complete')return;intro.hidden=true;panel.hidden=true;clearInterval(timer);phase('complete');}
 function animations(element){return element.getAnimations?element.getAnimations():[];}
 function settled(values){return Promise.all(values.map(function(animation){return animation.finished.catch(function(){});}));}
 function reveal(){
  if(!ready||!animationDone||failed||disposed||fading)return;
  fading=true;panel.hidden=true;intro.hidden=false;phase('fading');
  // Flush the initial opacity before creating the real CSS transition.
  void intro.offsetWidth;intro.classList.add('leaving');
  settled(animations(intro)).then(finish);
 }
 function imageReady(image){return new Promise(function(resolve){
  function done(){image.removeEventListener('load',done);image.removeEventListener('error',done);if(image.decode&&image.naturalWidth)image.decode().catch(function(){}).then(resolve);else resolve();}
  if(image.complete)done();else{image.addEventListener('load',done);image.addEventListener('error',done);}
 });}
 Promise.all(pieces.map(imageReady)).then(function(){
  if(failed||disposed)return;intro.hidden=false;panel.hidden=true;phase('playing');intro.classList.add('playing');
  return settled(pieces.flatMap(animations)).then(function(){
   if(failed||disposed)return;
   // Preserve the approved final-pose hold (2.32 s movement + .33 s hold).
   // This is choreography, never a guessed announcement-ready timeout.
   return new Promise(function(resolve){setTimeout(resolve,matchMedia('(prefers-reduced-motion: reduce)').matches?0:330);});
  }).then(function(){if(failed||disposed)return;animationDone=true;phase('waiting');reveal();});
 });
 function show(text,error){if(ready||disposed)return;failed=true;clearInterval(timer);intro.hidden=true;phase('failed');panel.hidden=false;title.textContent=text;message.textContent='程序文件未能正常加载。可以点击重新加载；已保存的角色不会被删除。';document.getElementById('startup-help').hidden=false;detail.textContent=String(error)+'\n阶段：'+stage+'\n'+navigator.userAgent;}
 function progress(){if(failed||disposed||document.documentElement.dataset.cardStartup==='complete')return;var seconds=Math.floor((Date.now()-started)/1000);message.textContent=stage+' · 已等待 '+seconds+' 秒。';if(seconds>=20&&!fading&&document.documentElement.dataset.cardStartup!=='playing'){intro.hidden=true;panel.hidden=false;title.textContent='程序仍在加载';message.textContent+=' 网络较慢时可以继续等待，也可以重新加载。';document.getElementById('startup-help').hidden=false;detail.textContent='加载尚未完成；暂未收到文件加载错误。\n阶段：'+stage+'\n已等待：'+seconds+' 秒\n'+navigator.userAgent;}}
 window.addEventListener('dnd-card-failed',function(){if(disposed)return;failed=true;clearInterval(timer);intro.hidden=true;panel.hidden=true;phase('failed');});
 window.addEventListener('dnd-card-stage',function(event){stage=String(event.detail||stage);progress();});
 document.getElementById('startup-retry').onclick=function(){location.reload();};
 window.addEventListener('dnd-card-ready',function(){if(failed||disposed)return;ready=true;reveal();var icon=document.querySelector('[data-app-icon]');if(icon)icon.href=icon.getAttribute('data-app-icon');});
 window.addEventListener('error',function(event){var target=event.target;if(target&&target!==window&&(target.tagName==='SCRIPT'||target.tagName==='LINK'))show('程序文件加载失败',target.src||target.href);else if(event.message)show('程序启动失败',event.message);},true);
 window.addEventListener('unhandledrejection',function(event){show('程序启动失败',event.reason&&event.reason.message||event.reason);});
 window.addEventListener('pagehide',function(event){if(event.persisted)return;disposed=true;clearInterval(timer);phase('cancelled');});
 timer=setInterval(progress,1000);progress();
 if(!('noModule' in document.createElement('script'))){show('浏览器版本过旧','此浏览器不支持运行角色卡所需的 JavaScript 模块。');}
})();
</script>
<div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
