<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生命同步原型 · 本地模拟台</title></head><body><main class="demo"><small>本地模拟 · 不代表枭熊实测</small><h1>场景与独立窗口联动</h1><p>下方两个 iframe 模拟插件后台和入口。角色卡会在另一个浏览器窗口打开。</p><section><h2>模拟场景棋子</h2><label>当前生命<input id="scene-hp" type="number" value="20"></label><button id="scene-write">修改场景生命</button><output id="scene-state">等待后台</output><div class="actions"><button id="hide-panel">关闭入口面板</button><button id="show-panel">恢复入口面板</button><button id="scene-gone">模拟切换场景</button><button id="deny">撤销操作权限</button></div></section><iframe id="bridge" title="模拟后台" hidden></iframe><iframe id="panel" title="插件入口" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe><p class="muted">真实枭熊安装：<a href="./manifest.json">manifest.json</a>（仅当前电脑可访问本地地址）。</p></main><script type="module" src="/demo.ts"></script></body></html>
