<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联动角色卡 · 生命值原型</title></head><body><main class="card"><small>DND · 连接验证</small><h1 id="token">联动角色卡</h1><p id="status" role="status">等待枭熊连接…</p><section><h2>生命值</h2><div class="vital"><input id="hp" aria-label="当前生命值" type="number" min="0" max="9999" disabled><span>/</span><strong id="max">—</strong></div><div class="actions"><button id="damage" disabled>−1</button><button id="heal" disabled>＋1</button><button id="apply" disabled>应用数值</button></div></section><p class="muted" id="detail">只测试生命值通信，不导入或替换完整角色卡。</p><button id="disconnect">断开连接</button><details><summary>连接记录</summary><pre id="log"></pre></details></main><script type="module" src="/card.ts"></script></body></html>
